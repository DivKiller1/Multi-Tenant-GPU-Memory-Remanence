apiVersion: apps/v1
kind: Deployment
metadata:
  name: semantic-gateway
  labels:
    app: semantic-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: semantic-gateway
  template:
    metadata:
      labels:
        app: semantic-gateway
    spec:
      containers:
      - name: gateway
        image: gateway:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: semantic-gateway
spec:
  selector:
    app: semantic-gateway
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
